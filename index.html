<!DOCTYPE html>
<html lang="en" class="product">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moby Bank · Analyst Agent</title>
<!--
  Moby Bank Analyst Agent — single-file htmx client.
  Drop this file into any app that serves the API below. Set the API prefix in <meta name="api-base">.
  Every endpoint returns an HTML fragment (see htmx/API.md for the contract and element ids).
-->
<meta name="api-base" content="/ui">
<!-- Assets come from WebJars / mvnpm jars on the Quarkus classpath, so the page works without internet access. -->
<script src="/webjars/htmx.org/2.0.11/dist/htmx.min.js"></script>
<link rel="stylesheet" href="/_static/at/fontsource/manrope/5.3.0/400.css">
<link rel="stylesheet" href="/_static/at/fontsource/manrope/5.3.0/500.css">
<link rel="stylesheet" href="/_static/at/fontsource/manrope/5.3.0/700.css">
<style>
  :root{
    --bg:oklch(98.5% .004 245);--fg:oklch(18.4% .008 245);--card:oklch(100% 0 0);--muted:oklch(96.8% .005 245);
    --muted-fg:oklch(46.2% .014 245);--border:oklch(91.3% .007 245);--border-subtle:oklch(91.3% .007 245);
    --primary:oklch(54.6% .219 262);--primary-fg:oklch(98.5% .004 245);--sidebar:oklch(98.5% .004 245);
    --sidebar-fg:oklch(18.4% .008 245);--sidebar-border:oklch(91.3% .007 245);--sidebar-accent:oklch(96.8% .005 245);
    --success:oklch(48.1% .077 179.4);--hover:oklch(0% 0 0/.04);--shadow:0 1px 2px oklch(0% 0 0/.06),0 4px 12px oklch(0% 0 0/.06);
    --r:5px;--r-lg:8px;--sans:"Manrope",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .dark{
    --bg:oklch(10% .008 245);--fg:oklch(91.3% .007 245);--card:oklch(16% .012 245);--muted:oklch(20% .014 245);
    --muted-fg:oklch(66.1% .014 245);--border:oklch(36.6% .012 245);--border-subtle:oklch(21.4% .008 245);
    --primary:oklch(64% .169 249.4);--primary-fg:oklch(18.4% .008 245);--sidebar:oklch(16% .012 245);
    --sidebar-fg:oklch(100% 0 0);--sidebar-border:oklch(100% 0 0/.12);--sidebar-accent:oklch(21.4% .008 245);
    --success:oklch(73% .089 176.7);--hover:oklch(100% 0 0/.06);--shadow:0 1px 2px oklch(0% 0 0/.4),0 4px 12px oklch(0% 0 0/.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);font:420 14px/1.5 var(--sans)}
  a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg{flex-shrink:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r);font-weight:520;font-size:13px;border:1px solid transparent;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-primary{background:var(--primary);color:var(--primary-fg)}.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn-outline{border-color:var(--border);background:var(--card)}.btn-outline:hover:not(:disabled){background:var(--hover)}
  .btn-ghost{color:var(--muted-fg)}.btn-ghost:hover:not(:disabled){background:var(--hover);color:var(--fg)}
  .btn-sm{height:28px;padding:0 8px}.btn-icon{width:28px;padding:0}.btn-xs{height:24px;width:24px;padding:0}
  .btn.w-full{width:100%;justify-content:flex-start}
  .eyebrow{font-size:11px;font-weight:520;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);padding:4px 8px}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted-fg)}
  .trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Sidebar */
  aside.sidebar{width:264px;flex-shrink:0;display:flex;flex-direction:column;min-height:0;background:var(--sidebar);color:var(--sidebar-fg);border-right:1px solid var(--sidebar-border)}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
  .brand-mark{width:28px;height:28px;border-radius:var(--r);background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:680;font-size:12px}
  .brand strong{display:block;font-weight:680;line-height:1.2}.brand span{font-size:12px;color:var(--muted-fg)}
  .side-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:4px 8px 16px}
  .side-group{display:flex;flex-direction:column;gap:2px}
  .side-head{display:flex;align-items:center;justify-content:space-between}
  .row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:var(--r);font-size:13px;text-align:left;color:inherit}
  .row:hover{background:var(--hover)}
  .row[aria-current="true"]{background:var(--sidebar-accent);font-weight:520}
  .row .count{font-size:12px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
  .user{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--sidebar-border)}
  .avatar{width:28px;height:28px;border-radius:999px;background:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:520}
  .user div{flex:1;min-width:0;line-height:1.25}.user small{display:block;font-size:12px;color:var(--muted-fg)}

  /* Main */
  main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;height:52px;padding:0 20px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
  .topbar h1{flex:1;margin:0;font-size:14px;font-weight:520}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg)}
  .dot{width:8px;height:8px;border-radius:999px;background:var(--success)}.dot.cloud{background:var(--primary)}
  .thread{flex:1;min-height:0;overflow-y:auto}
  .thread-inner{max-width:760px;margin:0 auto;padding:32px 24px 24px;display:flex;flex-direction:column;gap:28px}
  .empty{text-align:center;padding-top:18vh}.empty h2{margin:0 0 8px;font-size:28px;font-weight:680;letter-spacing:-.01em}.empty p{margin:0;color:var(--muted-fg)}
  .msg-user{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .bubble{max-width:80%;padding:10px 14px;border-radius:var(--r-lg);background:var(--muted);white-space:pre-wrap;text-wrap:pretty}
  .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);font-size:12px}
  .chip .muted{font-size:12px}
  .chip button{display:flex;padding:2px;border-radius:4px;color:var(--muted-fg)}.chip button:hover{background:var(--hover)}
  .msg-agent{display:flex;flex-direction:column;gap:12px}
  .msg-agent p{margin:0;line-height:1.65;text-wrap:pretty}
  details.steps{align-self:flex-start;border:1px solid var(--border-subtle);border-radius:var(--r);min-width:280px;max-width:100%}
  details.steps summary{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;color:var(--muted-fg);cursor:pointer;list-style:none}
  details.steps summary::-webkit-details-marker{display:none}
  details.steps summary:hover{color:var(--fg)}
  details.steps summary svg{transition:transform .15s}details[open].steps summary svg{transform:rotate(90deg)}
  details.steps .step-list{display:flex;flex-direction:column;gap:6px;padding:4px 10px 10px 32px;border-top:1px solid var(--border-subtle)}
  .step{display:flex;gap:10px;font-size:12px;padding-top:4px;font-family:var(--mono)}.step span:first-child{width:64px;flex-shrink:0;color:var(--muted-fg)}
  .tbl{border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th{text-align:left;padding:8px 12px;font-weight:520;white-space:nowrap;background:var(--muted)}
  td{padding:8px 12px;white-space:nowrap;border-top:1px solid var(--border-subtle)}
  .thinking{display:none;align-items:center;gap:8px;font-size:13px;color:var(--muted-fg)}
  .thinking.htmx-request,.htmx-request .thinking{display:flex}
  .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--fg);border-radius:999px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Composer */
  .composer-wrap{padding:0 24px 20px;flex-shrink:0}
  .composer{max-width:760px;margin:0 auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column}
  #pending{display:flex;flex-wrap:wrap;gap:6px;padding:10px 10px 0}#pending:empty{display:none}
  .composer textarea{border:0;outline:0;resize:none;background:transparent;color:inherit;padding:14px 14px 6px;font:inherit;line-height:1.5;min-height:56px;max-height:200px;field-sizing:content}
  .composer-bar{display:flex;align-items:center;gap:4px;padding:6px 8px 8px}
  .composer-bar .grow{flex:1}

  /* Dialog */
  dialog{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);color:var(--fg);padding:0;width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
  dialog::backdrop{background:oklch(0% 0 0/.5)}
  .dlg{display:flex;flex-direction:column;gap:16px;padding:20px}
  .dlg h3{margin:0;font-size:16px;font-weight:680}.dlg h3+p{margin:4px 0 0;font-size:13px;color:var(--muted-fg)}
  .pick-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r);max-height:320px;overflow-y:auto}
  .pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-subtle);font-size:13px;cursor:pointer}
  .pick:last-child{border-bottom:0}.pick:hover{background:var(--hover)}.pick:has(input:disabled){cursor:default;color:var(--muted-fg)}
  .pick input{accent-color:var(--primary)}.pick div{flex:1;min-width:0}.pick strong{display:block;font-weight:520}.pick small{display:block;font-size:12px;color:var(--muted-fg)}
  .dlg-foot{display:flex;justify-content:flex-end;gap:8px}

  /* Toasts */
  #toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
  .toast{display:flex;gap:10px;align-items:flex-start;width:340px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);box-shadow:var(--shadow);font-size:13px}
  .toast strong{display:block;font-weight:520}.toast small{display:block;color:var(--muted-fg);font-size:12px}
  .toast .spinner{margin-top:2px}.toast .ok{color:var(--success);margin-top:1px}
</style>
</head>
<body hx-headers='{"Accept":"text/html"}'>

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">MB</div>
    <div><strong>Moby Bank</strong><span>Analyst Agent</span></div>
  </div>
  <div style="padding:0 12px 12px">
    <button class="btn btn-outline w-full" hx-post="/api/conversations" hx-target="#main" hx-swap="innerHTML">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>
  </div>
  <div class="side-scroll">
    <section class="side-group" id="folders" hx-get="/api/onedrive/folders" hx-trigger="load, folders-changed from:body" hx-swap="innerHTML">
      <!-- Server fragment: a .side-head + .row per folder (see API.md). Minimal fallback shown until it loads. -->
      <div class="side-head"><span class="eyebrow">OneDrive folders</span></div>
    </section>
    <section id="history" hx-get="/api/conversations" hx-trigger="load, conversations-changed from:body" hx-swap="innerHTML" style="display:flex;flex-direction:column;gap:16px"></section>
  </div>
  <div class="user">
    <div class="avatar">HG</div>
    <div><span>Hermione Granger</span><small>Credit Research</small></div>
    <button class="btn btn-ghost btn-sm btn-icon" id="theme-toggle" aria-label="Toggle theme">
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</aside>

<!-- #main is replaced wholesale by GET /api/conversations/{id} and POST /api/conversations.
     The markup below is the reference shape the server should return (empty conversation). -->
<main id="main" hx-get="/api/conversations/current" hx-trigger="load" hx-swap="innerHTML">
  <header class="topbar">
    <h1 class="trunc">New conversation</h1>
    <div class="status"><span class="dot"></span>Local model · on-prem</div>
    <button class="btn btn-primary btn-sm" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/><path d="M12 16v-5M9.5 13.5L12 11l2.5 2.5"/></svg>
      Move to cloud
    </button>
  </header>
  <div class="thread" id="thread">
    <div class="thread-inner" id="messages">
      <div class="empty"><h2>What should we analyze?</h2><p>Attach filings or pull documents from a connected OneDrive folder.</p></div>
    </div>
  </div>
  <div class="composer-wrap">
    <form class="composer" id="composer" hx-post="/api/conversations/new/messages" hx-target="#messages" hx-swap="beforeend" hx-encoding="multipart/form-data" hx-indicator="#thinking" hx-disabled-elt="find button[type=submit]">
      <div id="pending"></div>
      <textarea name="text" rows="2" placeholder="Ask about a filing, or tell the agent what to do…"></textarea>
      <div class="composer-bar">
        <input type="file" name="files" multiple hidden id="file-input">
        <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('file-input').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l8-8"/></svg>
          Upload
        </button>
        <button type="button" class="btn btn-ghost btn-sm" hx-get="/api/onedrive/picker?mode=attach" hx-target="#dialog" hx-swap="innerHTML">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          From OneDrive
        </button>
        <span class="grow"></span>
        <button type="submit" class="btn btn-primary btn-sm btn-icon" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </div>
</main>

<dialog id="dialog"></dialog>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
  // API prefix: all hx-* paths start with /api; rewrite to the configured base.
  var base=(document.querySelector('meta[name=api-base]')||{}).content||'/api';
  document.body.addEventListener('htmx:configRequest',function(e){
    if(e.detail.path.indexOf('/api')===0) e.detail.path=base+e.detail.path.slice(4);
  });

  // Theme (persisted)
  var root=document.documentElement,key='moby-agent-theme';
  function apply(dark){root.classList.toggle('dark',dark);document.querySelector('.icon-moon').style.display=dark?'none':'';document.querySelector('.icon-sun').style.display=dark?'':'none';}
  apply(localStorage.getItem(key)==='dark');
  document.getElementById('theme-toggle').addEventListener('click',function(){var d=!root.classList.contains('dark');localStorage.setItem(key,d?'dark':'light');apply(d);});

  // Toasts. Server can raise one via header: HX-Trigger: {"toast":{"title":"…","description":"…","variant":"success"}}
  var toasts=document.getElementById('toasts');
  function toast(o){
    var el=o.id&&document.getElementById(o.id)||document.createElement('div');
    el.className='toast'; if(o.id) el.id=o.id;
    el.innerHTML=(o.variant==='loading'?'<span class="spinner"></span>':'<svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>')
      +'<div><strong></strong><small></small></div>';
    el.querySelector('strong').textContent=o.title||''; el.querySelector('small').textContent=o.description||'';
    if(!el.parentNode) toasts.appendChild(el);
    clearTimeout(el._t); if(o.variant!=='loading') el._t=setTimeout(function(){el.remove()},o.duration||4000);
    return el;
  }
  window.mobyToast=toast;
  document.body.addEventListener('toast',function(e){toast(e.detail)});

  // Dialogs: any fragment swapped into <dialog> opens it; a fragment with data-close closes it.
  var dlg=document.getElementById('dialog');
  dlg.addEventListener('htmx:afterSwap',function(){ if(dlg.querySelector('[data-close]')){dlg.close();dlg.innerHTML='';} else if(!dlg.open) dlg.showModal(); });
  dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });
  document.body.addEventListener('close-dialog',function(){dlg.close();dlg.innerHTML='';});

  // Composer: pending chips for local uploads; Enter sends; clear after send; scroll thread.
  document.body.addEventListener('change',function(e){
    if(e.target.id!=='file-input') return;
    var pending=document.getElementById('pending');
    Array.from(e.target.files).forEach(function(f){
      var c=document.createElement('span');c.className='chip';c.dataset.local=f.name;
      c.innerHTML='<span></span><span class="muted">Upload</span><button type="button" aria-label="Remove"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
      c.firstChild.textContent=f.name; pending.appendChild(c);
    });
  });
  document.body.addEventListener('click',function(e){
    var b=e.target.closest('.chip button'); if(!b) return;
    var chip=b.closest('.chip'); if(chip.dataset.local){ // rebuild FileList without this file
      var inp=document.getElementById('file-input'),dt=new DataTransfer();
      Array.from(inp.files).forEach(function(f){if(f.name!==chip.dataset.local)dt.items.add(f)}); inp.files=dt.files;
    }
    chip.remove();
  });
  document.body.addEventListener('keydown',function(e){
    if(e.target.matches('#composer textarea')&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit();}
  });
  document.body.addEventListener('htmx:beforeRequest',function(e){
    var f=e.target.closest&&e.target.closest('#composer'); if(!f) return;
    if(!f.text.value.trim()&&!document.getElementById('pending').children.length) e.preventDefault();
  });
  document.body.addEventListener('htmx:afterRequest',function(e){
    var f=e.target.closest&&e.target.closest('#composer'); if(!f||!e.detail.successful) return;
    f.text.value=''; document.getElementById('pending').innerHTML=''; document.getElementById('file-input').value='';
  });
  document.body.addEventListener('htmx:afterSettle',function(e){
    var t=document.getElementById('thread'); if(t&&e.target.closest&&e.target.closest('#main')) t.scrollTop=t.scrollHeight;
  });

  // Move to cloud: loading toast on request; server finishes it with HX-Trigger toast using id "move-cloud".
  document.body.addEventListener('htmx:beforeRequest',function(e){
    if(e.target.matches&&e.target.matches('[data-move-cloud]')) toast({id:'move-cloud',variant:'loading',title:'Moving session to Moby Private Cloud…',description:'Packaging context and files'});
  });
  document.body.addEventListener('htmx:responseError',function(e){
    toast({title:'Request failed',description:e.detail.xhr.status+' '+e.detail.pathInfo.requestPath});
  });
})();
</script>
</body>
</html>
