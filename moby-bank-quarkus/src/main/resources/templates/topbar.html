{@com.mobybank.harness.application.SessionDTO session}
{@boolean oob}
<header class="topbar" id="topbar" data-location="{session.location}"{#if oob} hx-swap-oob="true"{/if}>
  <h1 id="conversation-title" class="trunc">{session.title}</h1>
  {#if session.location == 'cloud'}
  <div class="status"><span class="dot cloud"></span>Cloud model · Moby Private Cloud</div>
  {#else}
  <div class="status"><span class="dot"></span>Local model · on-prem</div>
  {/if}
  {#if session.started}
  <div class="move-buttons">
    <button class="btn btn-sm {#if session.location == 'local'}btn-outline{#else}btn-primary{/if}" data-move-local hx-post="/api/conversations/{session.id}/move?to=local" hx-target="#main" hx-swap="innerHTML"{#if session.location == 'local' || session.status != 'idle'} disabled{/if}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/><path d="M12 11v5M9.5 13.5L12 16l2.5-2.5"/></svg>
      Move to local
    </button>
    <button class="btn btn-sm {#if session.location == 'cloud'}btn-outline{#else}btn-primary{/if}" data-move-cloud hx-post="/api/conversations/{session.id}/move?to=cloud" hx-target="#main" hx-swap="innerHTML"{#if session.location == 'cloud' || session.status != 'idle'} disabled{/if}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/><path d="M12 16v-5M9.5 13.5L12 11l2.5 2.5"/></svg>
      Move to cloud
    </button>
  </div>
  {#else}
  <div class="move-buttons">
    <button class="btn btn-sm btn-primary" data-run-local hx-post="/api/conversations/{session.id}/run?at=local" hx-target="#main" hx-swap="innerHTML">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>
      Run locally
    </button>
    <button class="btn btn-sm btn-primary" data-run-cloud hx-post="/api/conversations/{session.id}/run?at=cloud" hx-target="#main" hx-swap="innerHTML">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 0 0 4.5 12 3.5 3.5 0 0 0 6 19z"/></svg>
      Run in cloud
    </button>
  </div>
  {/if}
  {#if session.status != 'idle'}
  <div data-poll hidden hx-get="/api/conversations/{session.id}" hx-trigger="every 5s" hx-target="#thread" hx-swap="outerHTML" hx-select="#thread" hx-select-oob="#topbar"></div>
  {/if}
</header>
