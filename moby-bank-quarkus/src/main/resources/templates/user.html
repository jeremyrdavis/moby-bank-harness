{@com.mobybank.harness.application.UserDTO user}
<div class="avatar">{user.initials}</div>
<div><span>{user.name}</span><small>{user.role}</small></div>
{#if signOut}
<form method="post" action="/auth/logout" style="margin:0">
  <button class="btn btn-ghost btn-sm btn-icon" type="submit" aria-label="Sign out" title="Sign out">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
  </button>
</form>
{/if}
