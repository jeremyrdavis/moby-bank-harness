# Who the sidebar shows as signed in (authentication is out of scope for the demo)
harness.user.name=Hermione Granger
harness.user.role=Credit Research

# Which implementation backs each external port: fake is the default and needs nothing installed
# set to sbx and graph to use the real sandboxes and OneDrive
harness.sandbox.mode=sbx
harness.documents.mode=graph

# Real sandboxes (harness.sandbox.mode=sbx) drive the agent with the sbx CLI. All of these are optional:
#   harness.sbx.binary=sbx                                    the sbx executable
#   harness.sbx.agent=claude                                  the agent a sandbox is created for and run inside it
#   harness.sbx.agent-args=--dangerously-skip-permissions --model claude-opus-5-5 --strict-mcp-config
#                                                             extra arguments on every agent run
#   harness.sbx.workspace-dir=/home/agent/workspace           attached files are copied to <dir>/files
#   harness.sbx.command-timeout=2m                            create, cp, ls, mkdir
#   harness.sbx.turn-timeout=10m                              one agent turn
#   harness.sbx.move-timeout=1h                               one sbx move (back to local took 5 to 17 minutes)
#   harness.sbx.cloud-ttl=8h                                  how long a cloud sandbox lives
#   harness.sbx.cloud-on-timeout=stop                         stop|delete|restart when that time runs out
#   harness.sbx.preflight-cache=5m                            how long /q/health/ready reuses its host check
#   harness.sbx.preflight-probe=false                         also run one trivial cloud turn at startup

# OneDrive (harness.documents.mode=graph) reads documents through Microsoft Graph. Give it ONE of:
#   harness.graph.access-token=...                             a ready-made bearer token (a quick demo; it expires in about an hour)
#   harness.graph.tenant-id / client-id / client-secret        an Entra app registration (client credentials)
# Supply secrets from the environment (HARNESS_GRAPH_CLIENT_SECRET=...), never from a committed file. Optional:
#   harness.graph.drive=me/drive                               me/drive needs a signed-in user's token; with client
#                                                              credentials use users/<upn>/drive or drives/<id>
#   harness.graph.folders-root=Credit Research/Coverage        the library is this folder's sub-folders (default: the drive root)
#   harness.graph.base-url=https://graph.microsoft.com/v1.0
#   harness.graph.request-timeout=30s
#   harness.graph.max-download-bytes=52428800                  the largest file that will be downloaded

# Load the prototype's demo conversations and connected folders at startup
harness.seed-demo-data=true

# How long the fake adapters take, in milliseconds (they imitate the prototype's timings)
harness.fake.agent-delay-ms=1800
harness.fake.move-packaging-ms=1100
harness.fake.move-transfer-ms=1500
# Simulated faults (off by default): lose a cloud sandbox after N cloud turns, or refuse moves: none|to-cloud|to-local
#   harness.fake.cloud-expiry-turns=0
#   harness.fake.move-failure=none

# The htmx page (index.html at the repository root, served at /) calls the HTML endpoints under /ui. A request for
# a reply or a move waits for the agent or the transfer for at most this long.
harness.ui.wait-timeout=180s

# HTTP: the prototype UI is served from another origin (npm start in moby-bank-prototype, port 4173)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4173,http://127.0.0.1:4173
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept
quarkus.http.limits.max-body-size=50M
quarkus.http.enable-compression=true

# API contract for other implementations: the generated OpenAPI document is written to openapi.yaml at build time
quarkus.smallrye-openapi.info-title=Moby Bank agent harness API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=HTTP and server-sent-events API used by the harness UI. Every backend implementation (Quarkus, Python) must match this contract.
quarkus.smallrye-openapi.store-schema-directory=.
# The HTML endpoints for index.html are not part of the contract the Python backend must match
mp.openapi.scan.exclude.packages=com.mobybank.harness.interfaces.web

# Tests run against the fakes and should not wait
%test.harness.sandbox.mode=fake
%test.harness.documents.mode=fake
%test.harness.fake.agent-delay-ms=0
%test.harness.fake.move-packaging-ms=0
%test.harness.fake.move-transfer-ms=0

# Logging: the harness logs what it does at DEBUG (requests, session changes, sandbox commands, Graph calls) and
# fine detail at TRACE. Set HARNESS_LOG_LEVEL=INFO (or TRACE) to change it.
quarkus.log.category."com.mobybank".level=${HARNESS_LOG_LEVEL:DEBUG}

# Database: PostgreSQL through Hibernate ORM. In dev mode and in tests Quarkus Dev Services starts a PostgreSQL
# container (Docker must be running), so no URL is set. Elsewhere set QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD. There is no migration tool: Hibernate creates and
# updates the tables ("update") and never drops them; tests start every run from an empty schema.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17
quarkus.hibernate-orm.schema-management.strategy=update
# JSON columns (a message's files, steps, paragraphs and table) use Hibernate's own mapper, not the REST one
quarkus.hibernate-orm.mapping.format.global=ignore
# In dev mode, log every SQL statement with the values bound to its parameters. Those values include message text and
# uploaded content, so this is dev only; to see them elsewhere set QUARKUS_HIBERNATE_ORM_LOG_SQL=true and
# QUARKUS_HIBERNATE_ORM_LOG_BIND_PARAMETERS=true for that run.
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.bind-parameters=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
