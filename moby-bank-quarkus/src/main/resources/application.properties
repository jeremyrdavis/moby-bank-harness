# Who the sidebar shows as signed in (authentication is out of scope for the demo)
harness.user.name=Hermione Granger
harness.user.role=Credit Research

# Which implementation backs each external port: fake is the default and needs nothing installed
harness.sandbox.mode=fake
harness.documents.mode=fake

# Load the prototype's demo conversations and connected folders at startup
harness.seed-demo-data=true

# How long the fake adapters take, in milliseconds (they imitate the prototype's timings)
harness.fake.agent-delay-ms=1800
harness.fake.move-packaging-ms=1100
harness.fake.move-transfer-ms=1500

# Tests should not wait
%test.harness.fake.agent-delay-ms=0
%test.harness.fake.move-packaging-ms=0
%test.harness.fake.move-transfer-ms=0
